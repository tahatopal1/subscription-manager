_format_version: "3.0"

services:

  # ── auth-service (port 8070) ──────────────────────────────────────────────
  # Controllers: AuthController, UserController, UserAdminController
  - name: auth-service
    host: auth-upstream
    routes:
      - name: auth-route           # POST /api/auth/register, POST /api/auth/login
        paths:
          - /api/auth
        strip_path: false

      - name: auth-users-route     # GET /api/users, PUT /api/users, PATCH /api/users/password
        paths:
          - /api/users
        strip_path: false

      - name: auth-admin-users-route  # GET|POST|PUT|PATCH|DELETE /api/admin/users/**
        paths:
          - /api/admin/users
        strip_path: false

  # ── subscription-service (port 8072) ─────────────────────────────────────
  # Controllers: SubscriptionController, AdminSubscriptionController
  - name: subscription-service
    host: sub-upstream
    routes:
      - name: sub-route            # POST|GET /api/subscriptions, PUT /{id}/cancel,
                                   # POST /retry, POST /{id}/reactivate
        paths:
          - /api/subscriptions
        strip_path: false

      - name: sub-admin-route      # GET|POST|PUT /api/admin/subscriptions/**
        paths:
          - /api/admin/subscriptions
        strip_path: false

  # ── payment-service (port 8071) ──────────────────────────────────────────
  # Controllers: PaymentController, AdminPaymentController
  - name: payment-service
    host: pay-upstream
    routes:
      - name: pay-route            # GET|POST|DELETE /api/payments/methods,
                                   # GET /api/payments/transactions
        paths:
          - /api/payments
        strip_path: false

      - name: pay-admin-route      # GET /api/admin/payments/transactions
        paths:
          - /api/admin/payments
        strip_path: false

  # ── notification-service (port 8073) ─────────────────────────────────────
  # Controllers: AdminNotificationController
  - name: notification-service
    host: notif-upstream
    routes:
      - name: notif-admin-route    # POST /api/admin/notifications/send-custom,
                                   # POST /api/admin/notifications/{id}/resend
        paths:
          - /api/admin/notifications
        strip_path: false

upstreams:
  - name: auth-upstream
    targets:
      - target: host.docker.internal:8070
  - name: sub-upstream
    targets:
      - target: host.docker.internal:8072
  - name: pay-upstream
    targets:
      - target: host.docker.internal:8071
  - name: notif-upstream
    targets:
      - target: host.docker.internal:8073

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 10
      policy: redis
      redis_host: local-redis # Matches your docker-compose service name
      redis_port: 6379
      redis_password: redispass