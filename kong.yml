_format_version: "3.0"

services:

  # ── auth-service (port 8070) ──────────────────────────────────────────────
  - name: auth-service
    host: auth-upstream
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false
      - name: auth-users-route
        paths:
          - /api/users
        strip_path: false
      - name: auth-admin-users-route
        paths:
          - /api/admin/users
        strip_path: false

  # ── subscription-service (port 8072) ─────────────────────────────────────
  - name: subscription-service
    host: sub-upstream
    routes:
      - name: sub-route
        paths:
          - /api/subscriptions
        strip_path: false
      - name: sub-admin-route
        paths:
          - /api/admin/subscriptions
        strip_path: false

  # ── payment-service (port 8071) ──────────────────────────────────────────
  - name: payment-service
    host: pay-upstream
    routes:
      - name: pay-route
        paths:
          - /api/payments
        strip_path: false
      - name: pay-admin-route
        paths:
          - /api/admin/payments
        strip_path: false

  # ── notification-service (port 8073) ─────────────────────────────────────
  - name: notification-service
    host: notif-upstream
    routes:
      - name: notif-admin-route
        paths:
          - /api/admin/notifications
        strip_path: false

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8070
  - name: sub-upstream
    targets:
      - target: subscription-service:8072
  - name: pay-upstream
    targets:
      - target: payment-service:8071
  - name: notif-upstream
    targets:
      - target: notification-service:8073

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 10
      policy: redis
      redis_host: local-redis
      redis_port: 6379
      redis_password: redispass