server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Step 1: Extract the container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Step 2: The Filter! ONLY keep logs from containers whose names match your services
      - source_labels: ['container']
        regex: '.*(auth-service|subscription-service|payment-service|notification-service).*'
        action: keep